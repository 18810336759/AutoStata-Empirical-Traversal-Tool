# =========================
# analysis_config.yaml
# OPC / Auto-STATA 全局配置文件
# =========================
#
# 本文件只保存“所有效应模块共同使用”的公共规则。
# 这是下载/克隆到用户电脑后的本地文件；可用 VS Code 或普通文本编辑器修改。
# VS Code 只是编辑器，不会替用户上传配置或数据。运行脚本和默认输出都在本机。
# 不要在 GitHub 网页填写真实研究数据或个人路径；主动提交并推送会把文件送入仓库。
# 主效应、中介效应、调节效应的具体变量关系和假设，后续应分别放入各自模块 YAML。
# 结果整合、设定曲线、可展示案例和 do-file 衔接规则，放入 result_synthesis 模块 YAML。
#
# 重要提醒：
# 1. 修改数据、样本、缩尾、插值、控制变量、固定效应、聚类标准误时，改本文件。
# 2. 修改“哪个变量影响哪个变量”“假设方向是什么”时，不改本文件，改对应模块 YAML。
# 3. 三个回归 py 读取“全局 YAML + 对应效应 YAML”。
# 4. 结果整合 py 读取“全局 YAML + result_synthesis YAML + 三个效应输出结果”。
# 使用前请读同目录的 全局.md：先由研究者筛选并核查输入数据，再运行 skill/config_validation.py，
# 分别执行本轮启用的效应 runner，最后执行 result_synthesis/run_result_synthesis.py。
# 本文件的 sample_period / sample_rules 是说明标签，不会自动实施年份、ST 或行业筛选。

config_version: "2.0"

# 中文解释：
# config_version：配置文件版本号。
# 当前为 2.0，表示采用“全局配置 + 模块配置”的新结构。
# 注意：result_synthesis 属于 2.0 基础上的后处理扩展，自己的 synthesis.yaml 可使用 2.1。
# 为兼容现有主效应、中介效应、调节效应 runner，本文件暂不改为 2.1。
# 后续如果 YAML 结构升级，程序可根据版本号判断是否需要兼容旧写法。
# 小白提醒：这个字段通常不用改，除非程序说明要求升级版本。


# =========================
# 一、项目信息
# =========================

project:
  name: "公开演示"
  stage: "纯合成面板示例"
  description: "仅用于学习操作；不代表任何真实企业或论文结论"

# 中文解释：
# project：项目基本信息，用于输出目录命名、结果说明和复现。
# name：项目目录名称；同名项目运行使用同一目录，更名后保留原项目结果。
# stage：当前分析阶段，例如 baseline_testing、robustness_testing、mechanism_testing。
# description：对当前任务的简单说明，可写“基准回归第一轮”“更换因变量后重跑”等。
# 小白提醒：这里不影响回归计算本身，但会影响结果文件里的记录，建议每次正式运行前写清楚。


# =========================
# 二、运行设置
# =========================

run_settings:
  run_id: null
  enabled_modules:
    main_effect: true
    mediation_effect: true
    moderation_effect: true
    result_synthesis: true
  overwrite_existing: false
  fail_fast: false

# 中文解释：
# run_settings：控制“一次运行”的通用行为。
# run_id：公共批次的首选编号。null 时自动生成时间戳；数据和公共计算设定未变时，分别运行的效应模块复用同一批次。
# enabled_modules：控制本次分析计划启用哪些模块。
# main_effect：是否运行主效应模块。
# mediation_effect：是否运行中介效应模块。
# moderation_effect：是否运行调节效应模块。
# result_synthesis：是否运行结果整合与设定曲线模块。该模块不重新回归，只读取前三类效应结果。
# overwrite_existing：是否允许覆盖已有结果。小白用户建议保持 false，避免误删旧结果。
# fail_fast：遇到一个错误时是否立刻停止。false 表示尽量继续跑完并记录失败原因。
# 小白提醒：
# - 如果你的论文没有中介或调节，就把对应模块设为 false，不需要删除其他文件。
# - 如果你还没有跑完主效应/中介/调节，result_synthesis 可以先设为 false，等结果生成后再打开。


# =========================
# 三、数据与样本信息
# =========================

data:
  input_file: "data/演示数据.dta"

  sample_info:
    sample_name: "合成企业"
    sample_period: "2018-2023"
    sample_rules:
      - "纯合成演示"
    panel_structure: "stkcd-year"

  panel:
    entity_name: "stkcd"
    time_name: "year"

# 中文解释：
# data：数据文件和样本结构设置。
# input_file：原始数据文件路径。相对路径以本配置所属的基准检验目录为起点；也可填写客户电脑上的绝对路径。当前支持 .dta / .csv / .xlsx。
# sample_info：样本说明，用于输出目录命名和结果追踪。
# sample_name：样本简称，例如“制造企业”“A股上市公司”“高新技术企业”。
# sample_period：样本年份区间，例如 2014-2023。
# sample_rules：样本筛选规则说明，例如剔除 ST、剔除金融业、剔除缺失严重样本。
# 以上两项只作说明和目录标识，不会执行筛选。使用前请先按研究方案筛好数据，核对企业-年份唯一性、变量口径、缺失和异常值，并保留原始文件与筛选记录。
# panel_structure：面板结构说明，例如 stkcd-year、firm-year、province-year。
# panel.entity_name：个体编号变量名。企业面板通常是 stkcd 或 firm_id。
# panel.time_name：时间变量名。年度数据通常是 year。
# 小白提醒：变量名必须和数据表里的列名完全一致，包括大小写、中文、空格。


# =========================
# 四、连续变量与处理许可
# =========================

continuous_variable_settings:
  continuous_variables: "研发投入金额 总资产收益率 创新专利 高管持股 总资产 企业年龄 监管层持股 董事会持股 监事会持股 流动比率 存货周转率 资产负债率 营业毛利率 营业成本率 销售费用率 管理费用率 财务费用率"
  interpolate_allowed: "研发投入金额 总资产收益率 创新专利 高管持股 总资产 企业年龄 监管层持股 董事会持股 监事会持股 流动比率 存货周转率 资产负债率 营业毛利率 营业成本率 销售费用率 管理费用率 财务费用率"
  winsorize_allowed: "研发投入金额 总资产收益率 创新专利 高管持股 总资产 企业年龄 监管层持股 董事会持股 监事会持股 流动比率 存货周转率 资产负债率 营业毛利率 营业成本率 销售费用率 管理费用率 财务费用率"
  exclude_variables: "stkcd year"

# 中文解释：
# continuous_variable_settings：连续变量名单及其是否允许被处理。
# continuous_variables：你确认属于连续变量的变量全集，多个变量之间用空格分隔。
# interpolate_allowed：允许线性插值的变量，必须是 continuous_variables 的子集。
# winsorize_allowed：允许缩尾的变量，必须是 continuous_variables 的子集。
# exclude_variables：即使看起来是数字，也不能被插值或缩尾的变量，例如企业代码、年份、行业代码、分组编号。
# 提醒：
# - 不要把企业代码 stkcd、年份 year、行业代码等放入 winsorize_allowed。
# - 如果某个变量是 0/1 哑变量，通常也不应缩尾或插值。
# - 程序不会仅凭数据类型自动判断变量是否应该处理，最终以这里的名单为准。


# =========================
# 五、预处理与阶段 A/B 基础筛查空间
# =========================

preprocessing:
  sample_thresholds:
    - 2

  treatment_profiles:
    interpolate: true
    winsorize: true

  interpolation:
    method: "linear"
    scope: "within_entity"
    limit_direction: "both"
    max_gap: null

  winsorize:
    method: "winsorize"
    lower_quantile: 0.01
    upper_quantile: 0.99
    scope: "full_sample"
    available_scopes:
      - "full_sample"
      - "by_year"
      - "by_industry"
      - "by_industry_year"
    industry_name: null


# 中文解释：
# preprocessing：数据预处理和阶段 A/B 基础筛查的设定空间。
# sample_thresholds：在原始输入中按当前模型所需核心变量的有效年份数筛企业；例如 2 表示至少有 2 个有效年份。
# 固定顺序：原始核心变量有效年份门槛 → 企业内插值 → 缩尾 → 当前回归所需变量的完整案例筛选。
# 三个效应模块均调用同一预处理程序；中介各路径与跨模块模型按自身公式分别确定最终观测行和 N，不强制共同样本。
# treatment_profiles：阶段 A/B 是否对进入初筛的变量做统一处理。
# treatment_profiles.interpolate：是否启用插值。false 表示不插值，true 表示插值。
# treatment_profiles.winsorize：是否启用缩尾。false 表示不缩尾，true 表示缩尾。
# 是否展开插值方案仅由 treatment_profiles.interpolate 控制。
# interpolation.method：插值方法。linear 表示线性插值。
# interpolation.scope：插值范围。within_entity 表示只在同一家企业内部按年份插值，不跨企业插值。
# interpolation.limit_direction：both 对内部缺失按真实年份距离线性插值，并允许用最近观测值补两端；forward 只补尾端，backward 只补首端。
# interpolation.max_gap：按日历年计算允许的最大缺口。内部两端相隔的缺失日历年数超过此值时不插值；边界缺失按距最近观测的年份数判断。null 表示不限制。
# 是否展开缩尾方案仅由 treatment_profiles.winsorize 控制。
# winsorize.method：极端值处理方法。winsorize 表示把极端值压到指定分位点，而不是删除观测。
# winsorize.lower_quantile / upper_quantile：缩尾分位点。0.01 和 0.99 表示按 1% 和 99% 缩尾。
# winsorize.scope：缩尾分位点的计算范围。
# - full_sample：对通过当前模型有效年份门槛的处理范围统一计算分位点。
# - by_year：每一年分别计算分位点，适合不同年份量纲变化较明显的变量。
# - by_industry：每个行业分别计算分位点，适合行业差异较大的变量。
# - by_industry_year：每个行业-年份分别计算分位点，更细，但对样本量要求更高。
# winsorize.available_scopes：列出当前支持的四种缩尾范围，普通用户一般不用改。
# winsorize.industry_name：选择 by_industry 或 by_industry_year 时必须填写数据中的行业列名。
# 提醒：
# - 阶段 A/B 处理的是“主要变量 + 必选控制变量”，不处理 optional_controls 的复杂组合。
# - 主要变量包括因变量、自变量、中介变量、调节变量，以及构造交互项需要的变量。
# - 必选控制变量指 controls.required_controls。
# - optional_controls 留到阶段 C 再做组合筛查。
# - 如果不确定是否要插值或缩尾，建议先保持 false，跑出基准结果后再做稳健性扩展。
# - 正式论文中若使用插值或缩尾，应在数据处理部分说明规则。


# =========================
# 六、控制变量
# =========================

controls:
  required_controls: "总资产 企业年龄"
  optional_controls: "流动比率 资产负债率"
  active_optional_controls: ""

  combination_rules:
    enabled: true
    run_only_for_candidates: true
    min_optional_controls_in_combination: 1
    max_optional_controls_in_combination: 1

# 中文解释：
# controls：控制变量设置。
# required_controls：必选控制变量。阶段 A/B 基础筛查会统一加入这些变量。
# optional_controls：可选控制变量池。阶段 C 会从这里生成不同控制变量组合。
# active_optional_controls：手动指定当前启用的可选控制变量。若采用自动组合筛查，可留空。
# combination_rules.enabled：是否启用阶段 C 控制变量组合筛查。
# run_only_for_candidates：是否只对阶段 A/B 通过筛选的 candidate 模型展开阶段 C。
# min_optional_controls_in_combination：每个组合至少包含多少个可选控制变量。
# max_optional_controls_in_combination：每个组合最多包含多少个可选控制变量。
# 提醒：
# - required_controls 应该放理论上必须控制、几乎所有模型都要加入的变量。
# - optional_controls 应该放合理但存在选择空间的变量，用于稳健性筛查。
# - 不建议为了显著性随意增删控制变量；本系统的设计目标是诚实呈现不同合理设定下的结果分布。


# =========================
# 七、阶段 C 组合执行规则
# =========================

combination_execution:
  mode: "sampling_enumeration"
  early_stop: false
  top_k_limit: null
  random_seed: 12345
  max_candidates_to_expand: 2
  random_seeds_per_size: 1
  local_expansions_per_seed: 0

# 中文解释：
# combination_execution：阶段 C 如何生成和测试 optional_controls 组合。
# mode：组合执行模式。
# - full_enumeration：完整枚举所有控制变量组合，最全面，但变量多时很慢。
# - sampling_enumeration：抽样枚举，适合控制变量较多的场景。
# - heuristic_search：启发式搜索，后续可扩展。
# early_stop：是否找到一个通过结果就提前停止。建议 false，因为实证研究强调完整记录而不是只找显著。
# top_k_limit：是否只保留前 k 个结果。null 表示不做 top-k 截断。
# random_seed：随机种子，保证抽样组合可复现。
# max_candidates_to_expand：阶段 A/B 可能筛出很多 candidate，这里限制“最多拿多少个 candidate 进入阶段 C”。
# 例如设为 50，表示即使 A/B 找到 120 个 candidate，阶段 C 也最多展开前 50 个，避免运行量过大。
# random_seeds_per_size：每一种控制变量数量下，随机抽多少组控制变量组合。
# 例如可选控制变量组合大小为 6 到 10，random_seeds_per_size = 20，
# 程序会尝试抽 20 组 6 个控制变量、20 组 7 个控制变量……一直到 20 组 10 个控制变量。
# local_expansions_per_seed：抽到一组控制变量后，是否围绕这组变量继续做附近组合的微调搜索。
# 例如抽到 A B C D E F 后，再尝试把其中一个变量替换成 G 或 H。
# 当前建议保持 0，表示不做额外微调，先保证流程简单、清楚、可复现。
# 提醒：如果阶段 C 运行太慢，优先降低 random_seeds_per_size 或 max_candidates_to_expand。


# =========================
# 八、模型公共设定
# =========================

model_settings:
  fixed_effects:
    entity_fixed_effect: true
    entity_name: "stkcd"

    time_fixed_effect: true
    time_name: "year"

  clustered_standard_errors:
    enabled: false
    cluster_level: ""

  minimum_sample_size: 200

# 中文解释：
# model_settings：所有效应模块共同使用的模型设定。
# fixed_effects.entity_fixed_effect：是否加入个体固定效应。
# fixed_effects.entity_name：个体固定效应变量名，通常与 data.panel.entity_name 一致。
# fixed_effects.time_fixed_effect：是否加入时间固定效应。
# fixed_effects.time_name：时间固定效应变量名，通常与 data.panel.time_name 一致。
# clustered_standard_errors.enabled：是否使用聚类稳健标准误。
# clustered_standard_errors.cluster_level：聚类层级，例如 stkcd。若 enabled 为 false，可留空。
# minimum_sample_size：模型进入候选筛查时要求的最低样本量。
# 提醒：
# - 面板数据常见设定是企业固定效应 + 年份固定效应。
# - 如果启用聚类标准误，cluster_level 必须是数据中真实存在的变量。
# - minimum_sample_size 太高会筛掉很多模型，太低则结果可能不稳定。


# =========================
# 九、运行前校验
# =========================

validation:
  check_data_file_exists: true
  check_variables_exist: true
  check_global_variables_exist: true
  check_module_variables_exist: true
  check_hypotheses_variables_in_variable_blocks: true
  stop_if_missing_required_variables: true
  stop_if_no_enabled_hypotheses: false

# 中文解释：
# validation：运行前自动检查规则。
# check_data_file_exists：检查 data.input_file 是否真实存在。
# check_variables_exist：检查模型涉及变量是否存在于数据列中。
# check_global_variables_exist：检查全局控制变量、固定效应变量、连续变量是否存在。
# check_module_variables_exist：检查模块 YAML 中的自变量、因变量、中介变量、调节变量是否存在。
# check_hypotheses_variables_in_variable_blocks：检查假设中引用的变量是否已经写进模块变量区。
# stop_if_missing_required_variables：如果必需变量缺失，是否直接停止。
# stop_if_no_enabled_hypotheses：如果某个模块没有启用假设，是否停止。false 表示可正常跳过。
# 提醒：建议正式运行时保持这些检查开启，能避免“以为跑了新变量，实际还是旧变量”的问题。


# =========================
# 十、输出设置
# =========================

output_settings:
  output_root: "output"
  save_raw_results: true
  save_success_results: true
  save_summary_md: true
  save_excel_results: true
  save_csv_results: false
  save_config_snapshot: true

  standardized_output:
    enabled: true
    save_standardized_results: true
    save_specification_index: true
    include_formula: true
    include_config_paths: true

# 中文解释：
# output_settings：结果输出设置。
# output_root：输出总目录。相对路径以本机的 回归结果解读/基准检验 目录为起点；默认写入该目录下的 output/。
# 实际结果按 output_root/project.name/样本说明/模块 排列，不会自动上传到 GitHub。
# save_raw_results：是否保存全部结果，包括失败模型。
# save_success_results：是否保存成功运行结果。
# save_summary_md：是否输出 summary.md 摘要文件。
# save_excel_results：是否输出 Excel 文件。
# save_csv_results：是否输出供人工查看的普通 CSV；机器衔接表始终单独保存为 CSV。
# 机器衔接需要 standardized_results.csv、specification_index.csv 和 hypothesis_results.csv 同时生成；关闭标准化输出后本模块不能进入 synthesis，旧文件不会被借用。
# save_config_snapshot：控制结果整合目录是否另存便于查阅的配置副本；各效应模块为溯源而保存的实际运行快照始终生成。
# standardized_output：统一结果输出设置，用于后续把主效应、中介效应、调节效应合并分析。
# save_standardized_results：是否保存统一字段长表 standardized_results.csv，并同步生成假设级 hypothesis_results.csv；关闭后本次结果不能进入 synthesis。
# save_specification_index：是否保存设定索引表 specification_index.csv；关闭后本次结果不能进入 synthesis。
# include_formula：机器衔接表必须为 true，保存完整回归公式及模型项定义。
# include_config_paths：是否在统一表格中显示 YAML 路径；关闭后公共表头仍保留空列，运行快照照常保存。
# 小白提醒：
# - CSV 适合后续程序读取和合并分析。
# - Excel 适合人工查看。
# - standardized_results 是后续做综合分析和设定曲线的核心文件。


# =========================
# 十一、模块配置文件位置
# =========================

module_config_files:
  main_effect: "回归结果解读/基准检验/skill/main_effect/main.yaml"
  mediation_effect: "回归结果解读/基准检验/skill/mediation_effect/mediation.yaml"
  moderation_effect: "回归结果解读/基准检验/skill/moderation_effect/moderation.yaml"
  result_synthesis: "回归结果解读/基准检验/skill/result_synthesis/synthesis.yaml"

# 中文解释：
# module_config_files：各模块的分部 YAML 文件位置。
# main_effect：主效应配置文件，负责写主效应变量和主效应假设。
# mediation_effect：中介效应配置文件，负责写中介变量和中介路径假设。
# moderation_effect：调节效应配置文件，负责写调节变量、交互项和调节假设。
# result_synthesis：结果整合配置文件，负责写合并键、假设核对、设定曲线、案例编号和 do-file 衔接规则。
# 小白提醒：
# - 改公共规则，修改本文件。
# - 改论文假设，修改对应模块文件。
# - 改合并、设定曲线或可展示案例规则，修改 result_synthesis/synthesis.yaml。
# - 如果某个模块暂时不用，可以保留文件路径，但在 run_settings.enabled_modules 中设为 false。


# =========================
# 十二、重要提醒
# =========================

notes:
  - "本文件是全局公共配置，主效应、中介效应、调节效应的具体hypotheses见局部设定。"
  - "结果整合、设定曲线、可展示案例和 do-file 衔接规则见 skill/result_synthesis/synthesis.yaml。"
  - "修改数据文件、样本规则、连续变量、缩尾插值、控制变量、固定效应、聚类标准误时，修改本文件。"
  - "修改变量关系、假设方向、主效应/中介/调节的显著性规则时，修改对应模块 YAML。"
  - "正式运行前请确认所有变量名与数据列名完全一致。"
  - "阶段 A/B 用于基础设定筛查，阶段 C 用于控制变量组合筛查。"
  - "本项目强调完整记录和诚实呈现稳健性，不建议以寻找显著性为目的随意更改设定。"
  - "三个回归 py 需要统一适配 config_version 2.0 的全局 YAML + 模块 YAML 读取方式。"
  - "result_synthesis 是后处理扩展模块，不重新回归，只读取同一样本输出目录下的三个效应结果。"
